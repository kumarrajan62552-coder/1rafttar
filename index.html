        html, body {

            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.2) 0%, transparent 48%),
                radial-gradient(circle at top, #0b2342 0%, #051020 58%, #020711 100%);

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .main-card {
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            padding: 34px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, rgba(12, 32, 59, 0.97) 0%, rgba(7, 20, 38, 0.99) 100%);
            border: 1px solid rgba(56, 189, 248, 0.28);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(125, 211, 252, 0.3);
        }

        .logo-ring {
            width: 112px;
            height: 112px;
            border-radius: 9999px;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;

            box-shadow:
                0 0 36px rgba(14, 165, 233, 0.48),
                0 0 14px rgba(16, 185, 129, 0.22);
        }

        .logo-core {
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #07192d;
            background: radial-gradient(circle at 35% 28%, #38bdf8 0%, #0284c7 52%, #062544 100%);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 9999px;
            background: #0d2440;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #7dd3fc;
            margin-bottom: 16px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 8px #34d399;
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.15;
            text-transform: uppercase;
            color: #ffffff;
        }

        .title span {
            color: #34d399;
        }

        .subtitle {

            font-size: 14px;
            font-weight: 500;
            margin-top: 6px;
            margin-bottom: 24px;
        }

        .info-strip {
            width: 100%;
            background: #0b1f38;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .info-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #7dd3fc;
        }

        .info-item.secondary {
            color: #e2e8f0;
        }

        .info-divider {
            width: 1px;
            height: 16px;
            background: rgba(148, 163, 184, 0.45);
        }

        .cta-btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #2b8fff 0%, #0e63db 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
            box-shadow:
                0 12px 28px rgba(20, 115, 235, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
        }

        .cta-btn:hover {
            filter: brightness(1.08);
            box-shadow:
                0 15px 34px rgba(37, 137, 245, 0.62),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .status-box {
            display: none;
            width: 100%;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: #6ee7b7;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .status-box.visible {
            display: block;
        }

        .security-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .helper-text {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
            max-width: 300px;
        }

        .footer-credit {
            margin-top: 20px;
            padding-top: 14px;
            width: 100%;
            border-top: 1px solid rgba(56, 189, 248, 0.14);
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.02em;
        }

        .footer-credit a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-credit a:hover {
            text-decoration: underline;
        }
